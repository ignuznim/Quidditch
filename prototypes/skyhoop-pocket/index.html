<script>
'use strict';
// 스카이훅 포켓: a side-view broom sky sport in four shades of green pixels.
// The view is 160x144 pixels, scaled by whole numbers; every figure is a pixel sprite drawn below.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 160, H = 144;         // the native pixel screen
const PIXEL = true;             // whole-number scale, no smoothing
const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif';
const TITLE = '스카이훅 포켓';
const CONTROLS = ['방향키: 이동', 'Z 짧게: 패스', 'Z 길게: 슛', 'X: 돌진·빼앗기', 'Enter: 정지'];
const TOUCH_CONTROLS = ['십자키: 이동', 'A 짧게: 패스', 'A 길게: 슛', 'B: 돌진·빼앗기'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- The four shades --------------------------------------------------------------------
// 0 sky and highlights · 1 clouds, far towers, our robes · 2 stands, rival robes · 3 outlines, threats
const P = ['#e0f8d0', '#88c070', '#346856', '#081820'];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let touchMode = params.get('touch') === '1' || matchMedia('(pointer: coarse)').matches;
function fit() { // whole-number scale; on a phone held upright the buttons get the space under the screen
  document.body.classList.toggle('touch', touchMode);
  const portrait = innerHeight > innerWidth;
  const availH = innerHeight - (touchMode && portrait ? tune.touchPanel : 0);
  const k = Math.min(innerWidth / W, availH / H);
  const s = Math.max(1, Math.floor(k));
  canvas.width = W; canvas.height = H;
  canvas.style.width = W * s + 'px'; canvas.style.height = H * s + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((availH - H * s) / (touchMode && portrait ? 3 : 2))) + 'px';
  canvas.style.imageRendering = 'pixelated';
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fit); fit();
function rect(x, y, w, h, c) { ctx.fillStyle = P[c]; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function clear(c) { ctx.fillStyle = typeof c === 'number' ? P[c] : c; ctx.fillRect(0, 0, W, H); }

// Text: drawn once at its size, then snapped to the four shades, so letters are pixels too.
const textCache = new Map();
function textImage(s, size, c, outline) {
  const key = s + '|' + size + '|' + c + '|' + outline;
  let img = textCache.get(key);
  if (img) return img;
  const m = document.createElement('canvas').getContext('2d');
  m.font = `700 ${size}px ${FONT}`;
  const w = Math.ceil(m.measureText(s).width) + 4, h = size + 6;
  const src = document.createElement('canvas'); src.width = w; src.height = h;
  const g = src.getContext('2d'); g.font = `700 ${size}px ${FONT}`; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.fillText(s, 2, h / 2 + 0.5);
  const d = g.getImageData(0, 0, w, h).data, on = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) on[i] = d[i * 4 + 3] > 120 ? 1 : 0;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const o = out.getContext('2d');
  if (outline >= 0) {
    o.fillStyle = P[outline];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (on[y * w + x]) continue;
      let n = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < w && yy < h && on[yy * w + xx]) n++; }
      if (n) o.fillRect(x, y, 1, 1);
    }
  }
  o.fillStyle = P[c];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (on[y * w + x]) o.fillRect(x, y, 1, 1);
  textCache.set(key, out);
  return out;
}
/** Pixel text at (x, y), y is the middle of the line. */
function text(s, x, y, size = 11, c = 3, align = 'left', outline = -1) {
  const img = textImage(String(s), size, c, outline);
  const ox = align === 'center' ? img.width / 2 : align === 'right' ? img.width : 0;
  ctx.drawImage(img, Math.round(x - ox), Math.round(y - img.height / 2));
}
// A 3x5 pixel font for numbers and the clock
const DIG = { '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111', ':': '000010000010000' };
function digits(s, x, y, c = 0, scale = 1, align = 'left') {
  s = String(s); const w = s.length * 4 * scale - scale;
  let px = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  for (const ch of s) {
    const g = DIG[ch]; if (g) for (let i = 0; i < 15; i++) if (g[i] === '1') rect(px + (i % 3) * scale, y + Math.floor(i / 3) * scale, scale, scale, c);
    px += 4 * scale;

// ---- Sprites: rows of shade digits, '.' is see-through; drawn facing right --------------
const SPR = {
  usFlyer: [
    '......333', '.....31113', '....3111113', '....3100313', '....3100013', '..1..31113', '.11.3111103',
    '.1131111003', '..31111113', '..3111113', '22223333333333', '2.2.3..3', '....33'],

  usKeeper: [
    '.....3333', '....311113', '...31000013', '...31003013', '...31000013', '.3331111113333', '30031111113003',
    '30031111113003', '.33311111133', '...31111113', '22223333333333', '2.2.33..33', '....33..33'],
  rivalKeeper: [
    '..3.......3', '..33.3333.33', '...33222233', '...32000023', '...32003023', '.333222222333', '3003222222303',

  volla: ['..333..', '.32223.', '3220223', '3202223', '3222023', '.32223.', '..333..'],
  rumbler: ['....3....', '.3.333.3.', '..33333..', '.3332333.', '333323333', '.3333333.', '..33333..', '.3.333.3.', '....3....'],
  glimmerA: ['11.....11', '.11.3.11.', '...303...', '..30003..', '...303...', '....3....'],
  glimmerB: ['.........', '...333...', '1113031111', '.1300031.', '...303...', '....3....'],
  hawk: ['3.....3', '33.3.33', '.33333.', '..333..', '...3...'],
  crow: ['..33...', '333333.', '.3333.3', '..33...', '.3.3...'],

const sprCache = new Map();
function sprite(name, flip, invert) {
  const key = name + (flip ? 'L' : 'R') + (invert ? 'i' : '');
  let c = sprCache.get(key);
  if (c) return c;
  const rows = SPR[name], w = Math.max(...rows.map(r => r.length)), h = rows.length;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const ch = r[x]; if (ch === '.') continue; let v = +ch; if (invert) v = 3 - v; g.fillStyle = P[v]; g.fillRect(flip ? w - 1 - x : x, y, 1, 1); } });
  sprCache.set(key, c);
  return c;
}
/** Draws a sprite centred on (x, y) in screen pixels. */
function drawSpr(name, x, y, flip = false, invert = false) {
  const c = sprite(name, flip, invert);
  ctx.drawImage(c, Math.round(x - c.width / 2), Math.round(y - c.height / 2));
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {

const A_KEYS = ['KeyZ', 'Space', 'KeyJ'], B_KEYS = ['KeyX', 'ShiftLeft', 'ShiftRight', 'KeyK'];
const aDown = () => A_KEYS.some(k => down.has(k));
const aHit = () => A_KEYS.some(k => hit.has(k));
const bHit = () => B_KEYS.some(k => hit.has(k));
const startHit = () => pressed('Enter') || pressed('KeyP') || pressed('Escape');

// ---- Touch: the d-pad and buttons under the screen ------------------------------------------
const padDir = { x: 0, y: 0 };
const dpad = document.getElementById('dpad');
let padId = null;
function padAt(e) {
  const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const l = Math.hypot(dx, dy);
  padDir.x = 0; padDir.y = 0;
  if (l > 12) { const a = Math.atan2(dy, dx), oct = Math.round(a / (Math.PI / 4)); padDir.x = Math.round(Math.cos(oct * Math.PI / 4)); padDir.y = Math.round(Math.sin(oct * Math.PI / 4)); }

}
dpad.addEventListener('pointerdown', e => { e.preventDefault(); touchMode = true; fit(); padId = e.pointerId; dpad.setPointerCapture(e.pointerId); padAt(e); startAudio(); });
dpad.addEventListener('pointermove', e => { if (e.pointerId === padId) padAt(e); });
function padUp(e) { if (e.pointerId === padId) { padId = null; padDir.x = padDir.y = 0; dpad.className = 'dpad'; } }
dpad.addEventListener('pointerup', padUp); dpad.addEventListener('pointercancel', padUp);
function bindButton(id, code) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); startAudio(); el.setPointerCapture(e.pointerId); el.classList.add('down'); down.add(code); hit.add(code); });
  const up = () => { el.classList.remove('down'); down.delete(code); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
bindButton('bA', 'KeyZ'); bindButton('bB', 'KeyX'); bindButton('bStart', 'Enter'); bindButton('bMute', 'KeyM');
canvas.addEventListener('pointerdown', e => { // a tap on the screen starts and restarts
  if (e.pointerType !== 'mouse') { touchMode = true; fit(); }
  if (scene === 'title' || scene === 'results' || scene === 'pause') hit.add('Enter');
});
addEventListener('contextmenu', e => e.preventDefault());

// ---- Audio: square-wave beeps, started on first input, mute on M ----------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }

}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }

function tone(freq, dur, type = 'square', vol = 0.3, delay = 0, slide = 0) {

}
const SFX = {
  pass() { tone(880, 0.06, 'square', 0.18); },
  catch() { tone(660, 0.05, 'square', 0.14); },
  dash() { tone(300, 0.1, 'square', 0.12, 0, 2.2); },
  shot(p) { tone(p ? 520 : 320, 0.22, 'square', 0.22, 0, 3); },
  perfect() { [784, 1047, 1319].forEach((f, i) => tone(f, 0.1, 'square', 0.16, i * 0.05)); },
  goal() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.2, i * 0.08)); },
  conceded() { [392, 311, 262].forEach((f, i) => tone(f, 0.16, 'square', 0.16, i * 0.12)); },
  save() { tone(200, 0.1, 'square', 0.2); tone(150, 0.12, 'triangle', 0.25, 0.05); },
  thud() { tone(120, 0.25, 'sawtooth', 0.28, 0, 0.4); },
  steal() { tone(988, 0.05, 'square', 0.16); tone(1319, 0.08, 'square', 0.16, 0.05); },
  miss() { tone(220, 0.08, 'square', 0.1); },
  bell() { [1568, 2093, 1568, 2093].forEach((f, i) => tone(f, 0.14, 'square', 0.12, i * 0.12)); },
  win() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.16, 'square', 0.2, i * 0.1)); },
  lose() { [494, 440, 392, 330, 262].forEach((f, i) => tone(f, 0.2, 'square', 0.16, i * 0.14)); },
};

// ---- The match state ------------------------------------------------------------------
// Pitch: x from 0 to fieldWidth, y from the top of the sky (TOP) to the turf (FLOOR).
const TOP = 16, FLOOR = 118, HOOP_Y = [42, 64, 86];
const hoopX = side => side > 0 ? tune.fieldWidth - 14 : 14; // side +1: the right end, which 등불매 attacks
let scene, state;
function mkRider(id, team, role, x, y) {
  return { id, team, role, x, y, px: x, py: y, vx: 0, vy: 0, face: team === 0 ? 1 : -1, stun: 0, dashT: 0, dashCd: 0,
    dx: 0, dy: 0, immune: 0, holdT: 0, robbed: false, aiT: 0, sx: x, sy: y, bob: id * 1.7 };
}
function reset() {

    mkRider(0, 0, 'flyer', mid - 10, 64), mkRider(1, 0, 'flyer', mid - 40, 44), mkRider(2, 0, 'keeper', 30, 64),

    ball: { x: mid - 4, y: 66, px: mid - 4, py: 66, vx: 0, vy: 0, holder: 0, mode: 'held', team: 0, passTo: -1, age: 0, lastHolder: 0, tried: [], saveTried: false, perfect: false, trail: [] },
    rumblers: [
      { x: mid, y: 24, px: mid, py: 24, vx: 0, vy: 0, active: false, rest: 0, target: -1, retarget: 0 },
      { x: mid + 40, y: 24, px: mid + 40, py: 24, vx: 0, vy: 0, active: false, rest: 0, target: -1, retarget: 0 },
    ],
    glimmer: { active: false, x: mid, y: 40, px: mid, py: 40, vx: 0, vy: 0, wx: 1, wy: 0, turnT: 0, dartT: 0 },
    camX: mid - W / 2, camPX: mid - W / 2, shake: 0,
    charging: false, holdT: 0, actPrev: false, buffer: 0,
    msgs: [], lantern: { '1': 0, '-1': 0 }, cheer: 0, tut: 0, tutMoved: 0, glimmerNote: 0, resultsT: 0,

}
const RD = () => state.riders;
function ramp() { return Math.max(0, Math.min(1, (state.t - tune.laxUntil) / Math.max(1, tune.rampUntil - tune.laxUntil))); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---- Flying -----------------------------------------------------------------------------
/** Moves a rider one step toward the stick's direction; a dash overrides it. */
function fly(r, ix, iy, dt, mult) {
  r.stun = Math.max(0, r.stun - dt); r.dashCd = Math.max(0, r.dashCd - dt); r.immune = Math.max(0, r.immune - dt);
  if (r.stun > 0) { ix = Math.sin(state.t * 18 + r.id) * 0.5; iy = 0.4; mult *= 0.5; }
  const l = Math.hypot(ix, iy); if (l > 1) { ix /= l; iy /= l; }
  let tx = ix * tune.flySpeed * mult, ty = iy * tune.flySpeed * mult;
  if (r.dashT > 0) { r.dashT -= dt; tx = r.dx * tune.dashSpeed; ty = r.dy * tune.dashSpeed; }
  const a = tune.accel * dt * (r.dashT > 0 ? 3 : 1);
  r.vx += clamp(tx - r.vx, -a, a); r.vy += clamp(ty - r.vy, -a, a);
  r.x += r.vx * dt; r.y += r.vy * dt;

  state.actPrev = inp.a; state.buffer = Math.max(0, state.buffer - dt);
  if (inp.bHit) startDash(me, inp.ix, inp.iy);
  if (has) {
    if (pressedNow) { state.charging = true; state.holdT = 0; }
    if (state.charging && inp.a) state.holdT += dt;
    if (state.charging && releasedNow) {
      state.charging = false;
      const mate = RD()[1];
      if (state.holdT < tune.tapTime && mate.stun <= 0) { pass(me, mate); if (state.tut === 1) state.tut = 2; }
      else {
        const c = clamp(state.holdT / tune.chargeTime, 0, 1), perfect = c >= tune.sweetFrom && c <= tune.sweetTo;
        const sp = lerp(tune.shotMin, tune.shotMax, c) * (perfect ? 1.15 : 1), v = aimedShot(me, inp.iy, sp);
        shoot(me, v.vx, v.vy, perfect);
        if (perfect) { SFX.perfect(); msg('완벽한 슛!', 1); state.stats.perfect++; }
        if (state.tut === 2) state.tut = 3;
      }
    }
  } else {
    state.charging = false;
    if (pressedNow) { if (!startDash(me, inp.ix, inp.iy)) state.buffer = 0.25; else state.buffer = 0.25; }
  }
  if (me.dashT > 0) tryRob(me, tune.playerSteal);
}

// ---- The step --------------------------------------------------------------------------------
function updateMatch(dt) {
  const R = RD(), me = R[0];
  state.t += dt;
  for (const e of [...R, state.ball, ...state.rumblers, state.glimmer]) { e.px = e.x; e.py = e.y; }
  state.camPX = state.camX;
  const inp = readInput();
  fly(me, inp.ix, inp.iy, dt, speedMult(me));
  playerAct(me, inp, dt);
  for (const r of R) { if (r === me) continue; if (r.role === 'keeper') aiKeeper(r, dt); else aiFlyer(r, dt); }
  updateBall(dt);
  updateRumblers(dt);
  if (!state.over) updateGlimmer(dt);
  // teach by doing
  if (state.tut === 0 && (inp.ix || inp.iy)) { state.tutMoved += dt; if (state.tutMoved > 0.8) state.tut = 1; }
  // camera: you, a little ahead of where you face; never between pixels
  const want = clamp(me.x - W / 2 + me.face * 18, 0, tune.fieldWidth - W);
  state.camX = lerp(state.camX, want, Math.min(1, 5 * dt));
  state.shake = Math.max(0, state.shake - dt); state.cheer = Math.max(0, state.cheer - dt);
  for (const k in state.lantern) state.lantern[k] = Math.max(0, state.lantern[k] - dt);
  if (state.hoopHit) { state.hoopHit.t -= dt; if (state.hoopHit.t <= 0) state.hoopHit = null; }
  state.glimmerNote = Math.max(0, state.glimmerNote - dt);
  state.msgs.forEach(m => m.t -= dt); state.msgs = state.msgs.filter(m => m.t > 0);
  if (!state.over && state.t >= tune.matchTime) finish('time');
}

// ---- Drawing ---------------------------------------------------------------------------------
function dither(x, y, w, h, c, every = 2) { // a checker of one shade, the handheld way to shade
  ctx.fillStyle = P[c];
  for (let yy = 0; yy < h; yy++) for (let xx = (yy % 2); xx < w; xx += every) ctx.fillRect(x + xx, y + yy, 1, 1);
}
function drawWorld(cam, tNow) {
  const cx = Math.round(cam);
  clear(0);
  // far clouds and towers drift slower than the pitch
  const pc = Math.round(cx * 0.3), pt = Math.round(cx * 0.55);
  for (let i = 0; i < 6; i++) {
    const x = ((i * 71 - pc) % 260 + 260) % 260 - 40, y = 20 + (i * 13) % 24;
    dither(x, y, 26, 6, 1); rect(x + 4, y - 2, 16, 2, 1); rect(x + 2, y + 6, 22, 1, 1);
  }
  for (let i = 0; i < 9; i++) { // the arena's towers with flags
    const x = ((i * 57 - pt) % 360 + 360) % 360 - 60, h = 34 + (i * 7) % 16, y = FLOOR - h;
    rect(x, y, 10, h, 1); rect(x - 1, y - 1, 12, 2, 2); rect(x + 1, y - 7, 8, 6, 2); rect(x + 3, y - 10, 4, 3, 2); rect(x + 4, y - 13, 2, 3, 3);
    rect(x + 6, y - 13, 5, 3, i % 2 ? 0 : 2);
    for (let w = 0; w < h - 6; w += 9) rect(x + 4, y + 4 + w, 2, 3, 2);
  }
  // strings of lanterns along the top, blinking after a goal
  const flash = Math.max(state.lantern['1'], state.lantern['-1']);
  for (let x = -((cx * 0.8) % 16) - 16; x < W + 16; x += 16) {
    for (let k = 0; k < 16; k += 2) { const sag = Math.round(Math.sin(k / 16 * Math.PI) * 3); rect(x + k, 11 + sag, 2, 1, 3); }
    const on = flash > 0 ? (Math.floor(tNow * 12 + x) % 2 === 0) : true;
    rect(x + 7, 14, 3, 3, 3); rect(x + 8, 15, 1, 1, on ? 0 : 2);
  }
  // the turf and the stands
  rect(0, FLOOR, W, H - FLOOR, 2);
  const jump = state.cheer > 0 ? Math.round(Math.abs(Math.sin(tNow * 18)) * 2) : 0;
  for (let x = -(cx % 6); x < W; x += 6) {
    const col = ((x + cx) / 6 | 0) % 3;
    rect(x + 1, FLOOR + 3 - (col === 1 ? jump : 0), 3, 3, col === 2 ? 1 : 3);
    rect(x + 1, FLOOR + 9 - (col === 0 ? jump : 0), 3, 3, col === 1 ? 0 : 3);
  }
  rect(0, FLOOR, W, 1, 3); rect(0, H - 5, W, 5, 3);
  dither(0, H - 5, W, 1, 2);
  // hoops on their posts, a lantern on each
  for (const side of [1, -1]) {
    const gx = hoopX(side) - cx;
    if (gx < -10 || gx > W + 10) continue;
    HOOP_Y.forEach((hy, i) => {
      const hit = state.hoopHit && state.hoopHit.side === side && state.hoopHit.i === i;
      const half = tune.hoopHalf;
      rect(gx, hy + half + 2, 1, FLOOR - hy - half - 2, 3);
      for (let y = -half - 1; y <= half + 1; y++) { const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / (half + 1)) ** 2)) * 3); rect(gx - w, hy + y, 1, 1, 3); rect(gx + w, hy + y, 1, 1, hit ? 0 : 2); }
      rect(gx - 1, hy - half - 5, 3, 3, 3);
      const lit = state.lantern[String(side)] > 0 && Math.floor(tNow * 10) % 2 === 0;
      rect(gx, hy - half - 4, 1, 1, lit ? 0 : 1);
      if (lit) { rect(gx - 2, hy - half - 4, 1, 1, 0); rect(gx + 2, hy - half - 4, 1, 1, 0); rect(gx, hy - half - 7, 1, 1, 0); }
    });
  }
}
function ip(e, a) { return { x: lerp(e.px, e.x, a), y: lerp(e.py, e.y, a) }; }
const SPR_OF = r => r.role === 'keeper' ? (r.team === 0 ? 'usKeeper' : 'rivalKeeper') : (r.team === 0 ? 'usFlyer' : 'rivalFlyer');
function drawPlay(a) {
  const tNow = clock.now();
  const sh = state.shake > 0 ? Math.round(Math.sin(tNow * 60) * tune.shake) : 0;
  const cam = lerp(state.camPX, state.camX, a) + sh, cx = Math.round(cam);
  drawWorld(cam, tNow);
  const R = RD(), b = state.ball, g = state.glimmer;
  // the shot's dotted trail
  b.trail.forEach((p, i) => { if (i % 2 === 0) rect(p.x - cx, p.y, b.perfect ? 2 : 1, b.perfect ? 2 : 1, 3); });
  // riders
  for (const r of R) {
    const p = ip(r, a), bob = r.role === 'flyer' ? Math.round(Math.sin(tNow * 4 + r.bob)) : 0;
    const blink = r.stun > 0 && Math.floor(tNow * 14) % 2 === 0;
    if (r.dashT > 0) for (let k = 1; k <= 3; k++) rect(p.x - cx - r.dx * k * 4, p.y + 4 - r.dy * k * 3, 2, 1, 2);
    if (trailing(r.team) && r.role === 'flyer' && Math.floor(tNow * 8 + r.id) % 3 === 0) rect(p.x - cx - r.face * 9, p.y + 5, 1, 1, 3); // the catch-up sparkle
    if (!blink) drawSpr(SPR_OF(r), p.x - cx, p.y + bob, r.face < 0);
    if (r.id === 0) { // you: a little arrow above
      const ay = Math.round(p.y + bob - 12 + Math.sin(tNow * 6));
      rect(p.x - cx - 2, ay, 5, 1, 3); rect(p.x - cx - 1, ay + 1, 3, 1, 3); rect(p.x - cx, ay + 2, 1, 1, 3);
    }
  }
  // the ball, rumblers, glimmer
  const bp = ip(b, a);
  drawSpr('volla', bp.x - cx, bp.y);
  for (const rb of state.rumblers) if (rb.active) {
    const p = ip(rb, a); drawSpr('rumbler', p.x - cx, p.y, Math.floor(tNow * 8) % 2 === 0);
  }
  if (g.active) { const p = ip(g, a); drawSpr(Math.floor(tNow * 16) % 2 ? 'glimmerA' : 'glimmerB', p.x - cx, p.y); }
  // edge pointers for the ball and the glimmer
  pointer(bp.x - cx, bp.y, 'volla');
  if (g.active) pointer(g.x - cx, g.y, 'glimmer');
  drawHUD();
}
function pointer(sx, sy, kind) {
  if (sx >= 2 && sx <= W - 2) return;
  const left = sx < 2, x = left ? 3 : W - 4, y = clamp(Math.round(sy), TOP + 4, FLOOR - 4);
  const blink = kind === 'glimmer' ? Math.floor(clock.now() * 6) % 2 : 0;
  for (let i = 0; i < 3; i++) rect(left ? x + i : x - i, y - i, 1, i * 2 + 1, blink ? 2 : 3);
  if (kind === 'glimmer') rect(left ? x + 4 : x - 4, y - 1, 1, 3, 3);
}
function drawHUD() {
  const st = state;
  rect(0, 0, W, 10, 3);
  drawSpr('hawk', 6, 5, false, true); digits(st.score[0], 12, 3, 0);
  drawSpr('crow', W - 6, 5, true, true); digits(st.score[1], W - 12, 3, 0, 1, 'right');
  const left = Math.max(0, Math.ceil(tune.matchTime - st.t)), mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, '0');
  const blink = left <= 10 && Math.floor(st.t * 4) % 2 === 0;
  if (!blink) digits(`${mm}:${ss}`, W / 2, 3, 0, 1, 'center');
  if (!st.glimmer.active) { // a little bar to the glimmer
    const f = clamp(st.t / tune.glimmerAt, 0, 1); rect(W / 2 + 14, 4, 16, 3, 2); rect(W / 2 + 14, 4, Math.round(16 * f), 3, 1); rect(W / 2 + 31, 4, 2, 3, 0);
  }
  if (trailing(0) && Math.floor(st.t * 3) % 2 === 0) { rect(36, 2, 1, 6, 1); rect(35, 3, 3, 1, 1); rect(34, 4, 5, 1, 1); } // the catch-up arrow
  // the charge meter, with its perfect window
  const me = st.riders[0];
  if (st.charging) {
    const c = clamp(st.holdT / tune.chargeTime, 0, 1), x0 = 50, y0 = FLOOR - 16;
    rect(x0 - 1, y0 - 1, 62, 6, 3); rect(x0, y0, 60, 4, 0);
    dither(x0 + Math.round(60 * tune.sweetFrom), y0, Math.round(60 * (tune.sweetTo - tune.sweetFrom)), 4, 1);
    rect(x0, y0 + 1, Math.round(60 * c), 2, 3);
    const perfect = c >= tune.sweetFrom && c <= tune.sweetTo;
    text(st.holdT < tune.tapTime ? '떼면 패스' : perfect ? '지금!' : '슛 충전', W / 2, y0 - 9, 12, 3, 'center', 0);
  }
  if (me.stun > 0) text('휘청!', W / 2, FLOOR - 28, 12, 3, 'center', 0);
  // the one message
  for (const m of st.msgs) text(m.s, W / 2, 40, 15, 3, 'center', 0);
  // first-minute prompts
  const T = touchMode;
  const tips = [T ? '십자키로 날아요' : '방향키로 날아요', T ? 'A 짧게: 패스' : 'Z 짧게: 패스', T ? 'A 길게 떼면: 슛' : 'Z 길게 떼면: 슛', T ? 'B: 돌진·빼앗기' : 'X: 돌진·빼앗기'];
  if (st.tut < tips.length && st.t < 45 && st.msgs.length === 0) {
    if (st.tut === 3 && st.t > 25) {} else { rect(0, 10, W, 15, 1); text(tips[st.tut], W / 2, 17, 12, 3, 'center'); }
  }
  if (st.tut === 3 && st.riders[0].dashT > 0) st.tut = 4;
  if (st.glimmerNote > 0 && st.msgs.length === 0) { rect(0, 10, W, 15, 1); text('잡으면 +' + tune.glimmerPoints + ', 끝!', W / 2, 17, 12, 3, 'center'); }
}
function drawTitle() {
  const tNow = clock.now();
  drawWorld(((tNow * 20) % (tune.fieldWidth - W)), tNow);
  drawSpr('usFlyer', 36 + Math.sin(tNow * 2) * 4, 52 + Math.round(Math.sin(tNow * 3) * 2));
  drawSpr('volla', 46 + Math.sin(tNow * 2) * 4, 54 + Math.round(Math.sin(tNow * 3) * 2));
  drawSpr('rivalFlyer', 124 + Math.sin(tNow * 2 + 1) * 4, 54 + Math.round(Math.sin(tNow * 3 + 1) * 2), true);
  drawSpr(Math.floor(tNow * 16) % 2 ? 'glimmerA' : 'glimmerB', 80 + Math.cos(tNow * 1.7) * 22, 50 + Math.sin(tNow * 2.3) * 4);
  rect(8, 14, W - 16, 26, 3); rect(9, 15, W - 18, 24, 2); rect(10, 16, W - 20, 22, 3);
  text(TITLE, W / 2, 27, 16, 0, 'center');
  const lines = touchMode ? TOUCH_CONTROLS : CONTROLS;
  const y0 = 128 - lines.length * 13;
  rect(16, y0 - 4, W - 32, lines.length * 13 + 5, 3); rect(17, y0 - 3, W - 34, lines.length * 13 + 3, 0);
  lines.forEach((l, i) => text(l, 24, y0 + 4 + i * 13, 12, 3));
  if (Math.floor(tNow * 2) % 2 === 0) text(touchMode ? '눌러서 시작' : 'Enter로 시작', W / 2, 136, 12, 0, 'center', 3);
}

// ---- Scenes ------------------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear(0);
      rect(0, 0, W, 12, 3); text('선수와 공', W / 2, 6, 11, 0, 'center');
      const items = [['usFlyer', '우리 선수'], ['usKeeper', '우리 키퍼'], ['volla', '볼라'],
        ['rivalFlyer', '상대 선수'], ['rivalKeeper', '상대 키퍼'], ['rumbler', '럼블러'], ['glimmerA', '글리머']];
      items.forEach(([s, n], i) => {
        const col = i % 3, row = Math.floor(i / 3), x = 28 + col * 52, y = 30 + row * 42;
        drawSpr(s, x, y); text(n, x, y + 15, 11, 3, 'center');
      });
    },
  },
  title: {
    update() { if (startHit() || aHit()) { reset(); scene = 'play'; } },
    draw() { drawTitle(); },
  },
  play: {
    update(dt) {
      if (startHit()) { scene = 'pause'; return; }
      updateMatch(dt);
    },
    draw() { drawPlay(ALPHA); },
  },
  pause: {
    update() { if (startHit()) scene = 'play'; },
    draw() {
      drawPlay(1); dither(0, 11, W, H - 11, 3, 2);
      rect(30, 56, 100, 32, 3); rect(31, 57, 98, 30, 0);
      text('일시정지', W / 2, 66, 13, 3, 'center'); text(touchMode ? 'START: 계속' : 'Enter: 계속', W / 2, 80, 11, 2, 'center');
    },
  },
  results: {
    update(dt) {
      state.resultsT += dt;
      for (const e of [...RD(), state.ball, ...state.rumblers, state.glimmer]) { e.px = e.x; e.py = e.y; }
      state.camPX = state.camX;
      if (state.resultsT > 0.8 && (startHit() || aHit())) { reset(); scene = 'play'; }
    },
    draw() {
      drawPlay(1);
      rect(14, 22, W - 28, 100, 3); rect(15, 23, W - 30, 98, 0); rect(17, 25, W - 34, 94, 3); rect(18, 26, W - 36, 92, 0);
      const st = state, head = st.winner === 0 ? '승리!' : st.winner === 1 ? '패배' : '무승부';
      text(head, W / 2, 40, 18, 3, 'center');
      text(st.gained.replace(/^\S+\s/, ''), W / 2, 56, 11, 3, 'center');
      drawSpr('hawk', 50, 72); drawSpr('crow', 110, 72, true);
      digits(st.score[0], 64, 69, 3, 2); digits(st.score[1], 96, 69, 3, 2, 'right'); rect(79, 72, 2, 2, 3);
      text(`골 ${st.stats.goals} · 빼앗기 ${st.stats.steals}`, W / 2, 88, 11, 3, 'center');
      text(`완벽 ${st.stats.perfect} · 맞음 ${st.stats.hits}`, W / 2, 100, 11, 3, 'center');
      if (st.resultsT > 0.8 && Math.floor(clock.now() * 2) % 2 === 0) text(touchMode ? '눌러서 다시' : 'Enter: 다시', W / 2, 112, 11, 2, 'center');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() {
  scenes[scene].draw();
  const mb = document.getElementById('bMute'); if (mb) mb.textContent = muted ? '소리 꺼짐' : '소리';
}
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
