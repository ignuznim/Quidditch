<script>
'use strict';
// 스카이훅 포켓: a side-view broom sky sport in colourful pixel art.
// The pixel world is drawn at 256x160 on #game and scaled up crisply; all text is drawn on #hud
// at the screen's own resolution, so letters stay sharp while the art stays pixels.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 256, H = 160;         // the pixel screen
const PIXEL = true;             // crisp scale, no smoothing
const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif';
const TITLE = '스카이훅 포켓';
const CONTROLS = ['방향키 / WASD: 이동', 'Z 짧게: 패스 · 길게 눌렀다 떼기: 슛', 'X: 돌진해서 빼앗기', 'Enter: 일시정지 · M: 소리'];
const TOUCH_CONTROLS = ['십자키: 이동', 'A 짧게: 패스 · 길게 눌렀다 떼기: 슛', 'B: 돌진해서 빼앗기', 'START: 일시정지'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Colours --------------------------------------------------------------------------------
// UI shades by number: 0 cream, 1 pale sky, 2 deep blue, 3 ink. Sprites use the letters in COL.
const P = ['#fff4dc', '#bfe6fa', '#3b6a8a', '#1a1030'];
const COL = {
  '0': '#fff4dc', '1': '#bfe6fa', '2': '#3b6a8a', '3': '#1a1030',
  o: '#f08a3c', O: '#b4502a', t: '#3fb6a8', T: '#1f5f63', p: '#2a2040', s: '#f2c29a',
  r: '#d2412f', R: '#7e2424', y: '#ffd84a', Y: '#c58a1c', w: '#ffffff', b: '#7a4a2a', h: '#e6b85c', g: '#8a86a0', f: '#ff8a2a',
};
const col = c => typeof c === 'number' ? P[c] : (COL[c] || c);

// ---- Screen ---------------------------------------------------------------------------
const screenEl = document.getElementById('screen');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hudCanvas = document.getElementById('hud');
const hctx = hudCanvas.getContext('2d');
let touchMode = params.get('touch') === '1' || matchMedia('(pointer: coarse)').matches; // touch tips instead of key names
let hudScale = 1, shakeX = 0;
const deviceEl = document.getElementById('device'), bezelEl = document.getElementById('bezel');
const place = (el, x, y, w, h) => { el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(y) + 'px'; if (w != null) el.style.width = Math.round(w) + 'px'; if (h != null) el.style.height = Math.round(h) + 'px'; };
/** Lays out the handheld for the window: upright (screen on top, buttons below) or wide (buttons either side). */
function fit() {
  const iw = innerWidth, ih = innerHeight, wide = iw > ih * 1.15, dpr = devicePixelRatio || 1;
  let Dw, Dh, side = 0;
  if (wide) { Dh = Math.min(ih, 640); Dw = Math.min(iw, Dh * 2.3); side = Math.min(Dw * 0.2, Dh * 0.46); }
  else { Dw = Math.min(iw, ih * 0.62, 540); Dh = Math.min(ih, Dw * 1.85); }
  const rim = wide ? Dh * 0.05 : Dw * 0.05, bp = Math.max(10, Dw * (wide ? 0.012 : 0.035)), brandH = Math.max(18, (wide ? Dh : Dw) * 0.06);
  const maxW = wide ? Dw - 2 * side - 2 * bp : Dw - 2 * rim - 2 * bp - 8;
  const maxH = wide ? Dh - 2 * rim - 2 * bp - brandH : Dh * 0.5;
  const k = Math.min(maxW / W, maxH / H);
  // CSS pixels per art pixel: a whole number of device pixels, unless the screen is so dense
  // (3 or more device pixels per art pixel) that an uneven pixel cannot be seen
  const s = k * dpr >= 3 ? k : Math.max(1, Math.floor(k * dpr)) / dpr;
  const cw = Math.round(W * s), ch = Math.round(H * s);
  place(deviceEl, (iw - Dw) / 2, (ih - Dh) / 2, Dw, Dh);
  const bw = cw + 2 * bp + (wide ? 0 : 8), bh = ch + 2 * bp + brandH;
  const bx = (Dw - bw) / 2, by = wide ? (Dh - bh) / 2 : rim;
  place(bezelEl, bx, by, bw, bh);
  place(screenEl, (bw - cw) / 2, bp, cw, ch);
  const led = bezelEl.querySelector('.led'); place(led, Math.max(3, (bw - cw) / 2 - 7), bp + ch * 0.3);
  const brand = bezelEl.querySelector('.brand'); brand.style.top = Math.round(bp + ch + brandH * 0.12) + 'px'; brand.style.fontSize = Math.round(brandH * 0.62) + 'px';
  canvas.width = W; canvas.height = H;
  for (const c of [canvas, hudCanvas]) { c.style.width = cw + 'px'; c.style.height = ch + 'px'; }
  hudScale = s * dpr;
  hudCanvas.width = Math.round(W * hudScale); hudCanvas.height = Math.round(H * hudScale);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  // the controls
  const unit = wide ? Math.min(side, Dh * 0.5) : Math.min(Dw, (Dh - by - bh) * 1.1);
  const ds = Math.min(150, unit * 0.42), aS = Math.min(84, unit * 0.22), bS = aS * 0.85;
  let dx, dy, ax, ay, bx2, by2, py;
  if (wide) { dx = side / 2; dy = Dh * 0.5; ax = Dw - side * 0.3; ay = Dh * 0.43; bx2 = Dw - side * 0.68; by2 = Dh * 0.58; py = Dh - 26; }
  else {
    const top = by + bh, h = Dh - top;
    dx = Dw * 0.26; dy = top + h * 0.42; ax = Dw * 0.8; ay = top + h * 0.32; bx2 = Dw * 0.58; by2 = top + h * 0.5; py = top + h * 0.82;
  }
  dpad.style.transform = `scale(${ds / 150})`; place(dpad, dx - ds / 2, dy - ds / 2);
  const bA = document.getElementById('bA'), bB = document.getElementById('bB');
  place(bA, ax - aS / 2, ay - aS / 2, aS, aS); bA.style.fontSize = Math.round(aS * 0.38) + 'px';
  place(bB, bx2 - bS / 2, by2 - bS / 2, bS, bS); bB.style.fontSize = Math.round(bS * 0.38) + 'px';
  // 소리 and START: side by side under the buttons when upright; one in each side panel when wide
  const mx = wide ? side / 2 : Dw / 2 - 36, sx2 = wide ? Dw - side / 2 : Dw / 2 + 36, my = wide ? Dh * 0.82 : py;
  place(document.getElementById('bMute'), mx - 28, my - 9); place(document.getElementById('lMute'), mx - 20, my + 14);
  place(document.getElementById('bStart'), sx2 - 28, my - 9); place(document.getElementById('lStart'), sx2 - 22, my + 14);
  const gr = document.getElementById('grille');
  if (wide) gr.style.display = 'none'; else { gr.style.display = 'block'; place(gr, Dw - 82, Dh - 70, 60, 48); }
}
addEventListener('resize', fit);
function rect(x, y, w, h, c) { ctx.fillStyle = col(c); ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function clear(c) { ctx.fillStyle = col(c); ctx.fillRect(0, 0, W, H); }
/** Sharp text on the HUD layer; x, y in art pixels (y is the middle of the line), size in art pixels. */
function text(s, x, y, size = 8, c = 0, align = 'left', outline = 3) {
  const k = hudScale;
  hctx.font = `800 ${Math.round(size * k)}px ${FONT}`; hctx.textAlign = align; hctx.textBaseline = 'middle';
  hctx.lineJoin = 'round';
  if (outline !== -1) { hctx.lineWidth = Math.max(2, size * k * 0.24); hctx.strokeStyle = col(outline); hctx.strokeText(String(s), (x + shakeX) * k, y * k); }
  hctx.fillStyle = col(c); hctx.fillText(String(s), (x + shakeX) * k, y * k);
}
function hudClear() { hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height); }
// A 3x5 pixel font for the big score on the results screen
const DIG = { '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111', ':': '000010000010000' };
function digits(s, x, y, c = 3, scale = 1, align = 'left') {
  s = String(s); const w = s.length * 4 * scale - scale;
  let px = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  for (const ch of s) {
    const g = DIG[ch]; if (g) for (let i = 0; i < 15; i++) if (g[i] === '1') rect(px + (i % 3) * scale, y + Math.floor(i / 3) * scale, scale, scale, c);
    px += 4 * scale;

}

// ---- Sprites: rows of colour letters (see COL), '.' is see-through; drawn facing right -----
const SPR = {
  usFlyer: [ // 등불매: an orange hood, a short wing cape
    '......333', '.....3ooo3', '....3ooooo3', '....3oss3o3', '....3osss3', '.O...3oo3', '.OO.3oooos3',
    '.OOo3oooo0s3', '..3ooooo3', '..3oooo3', 'hhhhbbbbbbbbbbb', 'h.h.3..3', '....33'],
  rivalFlyer: [ // 폭풍까마귀: a pointed hat and a gold beak
    '.......3', '......3p3', '.....3pp3', '....3ppp3', '...3333333', '....3tss3', '....3s3sYY',
    '.T..3sss3', '.TT3ttttt3', '..3tttt0t3', '.3ttttt3', 'hhhhbbbbbbbbbbb', 'h.h.3..3', '....33'],
  usKeeper: [ // big cream gloves
    '.....3333', '....3oooo3', '...3osssso3', '...3os3sso3', '...3ossss3', '.333oooooo333', '3ww3oooooo3ww3',
    '3ww3oo00oo3ww3', '.333oooooo333', '...3oooooo3', 'hhhhbbbbbbbbbbb', 'h.h.33..33', '....33..33'],
  rivalKeeper: [ // horned helmet
    '..g.......g', '..gg.3333.gg', '...33pppp33', '...3tsssst3', '...3ts3sst3', '.333tttttt333', '3ww3tttttt3ww3',
    '3ww3tttttt3ww3', '.333tttttt333', '...3tttttt3', 'hhhhbbbbbbbbbbb', 'h.h.33..33', '....33..33'],
  volla: ['..333..', '.3rrr3.', '3rr0rr3', '3r0rrR3', '3rrr0R3', '.3RRR3.', '..333..'],
  rumbler: ['....f....', '.f.333.f.', '..33333..', '.33g3333.', 'f3g33333f', '.3333333.', '..33333..', '.f.333.f.', '....f....'],
  glimmerA: ['ww.....ww', '.www.www.', '...3y3...', '..3yyY3..', '...3Y3...'],
  glimmerB: ['.........', '...3y3...', 'www3yY3ww', '.ww3Y3ww.', '.........'],
  hawk: ['o.....o', 'oo.o.oo', '.ooooo.', '..ooo..', '...o...'],
  crow: ['..tt...', 'tttttt.', '.tttt.t', '..tt...', '.t.t...'],
};
const sprCache = new Map();
function sprite(name, flip) {
  const key = name + (flip ? 'L' : 'R');
  let c = sprCache.get(key);
  if (c) return c;
  const rows = SPR[name], w = Math.max(...rows.map(r => r.length)), h = rows.length;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const ch = r[x]; if (ch === '.') continue; g.fillStyle = COL[ch]; g.fillRect(flip ? w - 1 - x : x, y, 1, 1); } });
  sprCache.set(key, c);
  return c;
}
/** Draws a sprite centred on (x, y) in art pixels. */
function drawSpr(name, x, y, flip = false) {
  const c = sprite(name, flip);
  ctx.drawImage(c, Math.round(x - c.width / 2), Math.round(y - c.height / 2));
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => { down.clear(); padDir.x = padDir.y = 0; });
const A_KEYS = ['KeyZ', 'Space', 'KeyJ'], B_KEYS = ['KeyX', 'ShiftLeft', 'ShiftRight', 'KeyK'];
const aDown = () => A_KEYS.some(k => down.has(k));
const aHit = () => A_KEYS.some(k => hit.has(k));
const bHit = () => B_KEYS.some(k => hit.has(k));
const startHit = () => pressed('Enter') || pressed('KeyP') || pressed('Escape');

// ---- Touch: the d-pad and buttons under the screen ------------------------------------------
const padDir = { x: 0, y: 0 };
const dpad = document.getElementById('dpad');
let padId = null;
function padAt(e) {
  const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const l = Math.hypot(dx, dy);
  padDir.x = 0; padDir.y = 0;
  if (l > 12) { const a = Math.atan2(dy, dx), oct = Math.round(a / (Math.PI / 4)); padDir.x = Math.round(Math.cos(oct * Math.PI / 4)); padDir.y = Math.round(Math.sin(oct * Math.PI / 4)); }
  dpad.className = 'dpad' + (padDir.y < 0 ? ' on-up' : '') + (padDir.y > 0 ? ' on-dn' : '') + (padDir.x < 0 ? ' on-lf' : '') + (padDir.x > 0 ? ' on-rt' : '');
}
dpad.addEventListener('pointerdown', e => { e.preventDefault(); touchMode = true; padId = e.pointerId; dpad.setPointerCapture(e.pointerId); padAt(e); startAudio(); });
dpad.addEventListener('pointermove', e => { if (e.pointerId === padId) padAt(e); });
function padUp(e) { if (e.pointerId === padId) { padId = null; padDir.x = padDir.y = 0; dpad.className = 'dpad'; } }
dpad.addEventListener('pointerup', padUp); dpad.addEventListener('pointercancel', padUp);
function bindButton(id, code) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); startAudio(); el.setPointerCapture(e.pointerId); el.classList.add('down'); down.add(code); hit.add(code); });
  const up = () => { el.classList.remove('down'); down.delete(code); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
bindButton('bA', 'KeyZ'); bindButton('bB', 'KeyX'); bindButton('bStart', 'Enter'); bindButton('bMute', 'KeyM');
canvas.addEventListener('pointerdown', e => { // a tap on the screen starts and restarts
  if (e.pointerType !== 'mouse') touchMode = true;
  if (scene === 'title' || scene === 'results' || scene === 'pause') hit.add('Enter');
});
addEventListener('contextmenu', e => e.preventDefault());
fit();

// ---- Audio: square-wave beeps, started on first input, mute on M ----------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  pass() { tone(880, 0.06, 'square', 0.18); },
  catch() { tone(660, 0.05, 'square', 0.14); },
  dash() { tone(300, 0.1, 'square', 0.12, 0, 2.2); },
  shot(p) { tone(p ? 520 : 320, 0.22, 'square', 0.22, 0, 3); },
  perfect() { [784, 1047, 1319].forEach((f, i) => tone(f, 0.1, 'square', 0.16, i * 0.05)); },

        const c = sprite(s, false); ctx.drawImage(c, 0, 0, c.width, c.height, Math.round(x - c.width), Math.round(y - c.height), c.width * 2, c.height * 2);
        text(n, x, y + 22, 8, 0, 'center');
      });
    },
  },
  title: {
    update() { if (startHit() || aHit()) { reset(); scene = 'play'; } },
    draw() { drawTitle(); },
  },
  play: {
    update(dt) {
      if (startHit()) { scene = 'pause'; return; }
      updateMatch(dt);
    },
    draw() { drawPlay(ALPHA); },
  },
  pause: {
    update() { if (startHit()) scene = 'play'; },
    draw() {
      drawPlay(1); dither(0, 15, W, H - 15, '3', 2);
      panel(68, 58, 120, 42);
      text('일시정지', W / 2, 72, 13, 'y', 'center'); text(touchMode ? 'START를 누르면 계속' : 'Enter를 누르면 계속', W / 2, 88, 8, 0, 'center', -1);
    },
  },
  results: {
    update(dt) {
      state.resultsT += dt;
      for (const e of [...RD(), state.ball, ...state.rumblers, state.glimmer]) { e.px = e.x; e.py = e.y; }
      state.camPX = state.camX;
      if (state.resultsT > 0.8 && (startHit() || aHit())) { reset(); scene = 'play'; }
    },
    draw() {
      drawPlay(1);
      panel(40, 24, W - 80, 116);
      const st = state, head = st.winner === 0 ? '승리!' : st.winner === 1 ? '패배' : '무승부';
      text(head, W / 2, 42, 18, st.winner === 0 ? 'y' : st.winner === 1 ? '#9fd0e8' : 'w', 'center');
      text(st.gained.replace(/^\S+\s/, ''), W / 2, 60, 9, 0, 'center', -1);
      drawSpr('hawk', 84, 80); drawSpr('crow', 172, 80, true);
      digits(st.score[0], 120, 74, 'o', 3, 'right'); digits(st.score[1], 136, 74, 't', 3, 'left'); rect(127, 78, 2, 2, '0'); rect(127, 84, 2, 2, '0');
      text(`골 ${st.stats.goals} · 완벽한 슛 ${st.stats.perfect} · 빼앗기 ${st.stats.steals} · 맞음 ${st.stats.hits}`, W / 2, 104, 8, 0, 'center', -1);
      if (st.resultsT > 0.8 && Math.floor(clock.now() * 2) % 2 === 0) text(touchMode ? '눌러서 다시 하기' : 'Enter를 눌러 다시 하기', W / 2, 124, 10, 'w', 'center');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() {
  hudClear(); shakeX = 0;
  scenes[scene].draw();
  const mb = document.getElementById('lMute'); if (mb) mb.textContent = muted ? '소리 끔' : '소리';
}
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
