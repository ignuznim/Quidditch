<style>

    background: linear-gradient(170deg, #d6d4cd 0%, #c8c6bf 40%, #bdbbb3 100%);

  .offon { position: absolute; color: #8e8c86; font: italic 800 10px Arial, Helvetica, sans-serif; letter-spacing: 0.08em; }

  #bezel .ledlabel { position: absolute; color: #c8c6c0; font: 700 7px Arial, Helvetica, sans-serif; letter-spacing: 0.06em; transform: translateX(-50%); }

<div id="device">

<script>
'use strict';
// 퀴디치 포켓: a side-view broom sky sport in colourful pixel art.
// The pixel world is drawn at 208x160 on #game and scaled up crisply; all text is drawn on #hud
// at the screen's own resolution, so letters stay sharp while the art stays pixels.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 208, H = 160;         // the pixel screen: a close view, so riders read large on a phone
const PIXEL = true;             // crisp scale, no smoothing
const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif';
const TITLE = '퀴디치 포켓';
const CONTROLS = ['당신은 그리핀도르 파수꾼!', '방향키: 이동 · X: 몸 날려 막기', 'Z: 짧게 패스, 길게 멀리 던지기', 'Enter: 일시정지 · M: 소리'];
const TOUCH_CONTROLS = ['당신은 그리핀도르 파수꾼!', '십자키: 이동 · B: 몸 날려 막기', 'A: 짧게 패스, 길게 멀리 던지기', 'START: 일시정지 · SELECT: 소리'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Colours --------------------------------------------------------------------------------
// UI shades by number: 0 cream, 1 pale sky, 2 deep blue, 3 ink. Sprites use the letters in COL.
const P = ['#fff4dc', '#bfe6fa', '#3b6a8a', '#1a1030'];
const COL = {
  '0': '#fff4dc', '1': '#bfe6fa', '2': '#3b6a8a', '3': '#1a1030',
  o: '#d0343c', O: '#7e1e26', t: '#2f9a5a', T: '#1d5a36', p: '#2a2040', s: '#f2c29a',
  r: '#d2412f', R: '#7e2424', y: '#ffd84a', Y: '#c58a1c', w: '#ffffff', b: '#7a4a2a', h: '#e6b85c', g: '#8a86a0', f: '#ff8a2a',
};
const col = c => typeof c === 'number' ? P[c] : (COL[c] || c);

// ---- Screen ---------------------------------------------------------------------------
const screenEl = document.getElementById('screen');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hudCanvas = document.getElementById('hud');
const hctx = hudCanvas.getContext('2d');
let touchMode = params.get('touch') === '1' || matchMedia('(pointer: coarse)').matches; // touch tips instead of key names
let hudScale = 1, shakeX = 0;
const deviceEl = document.getElementById('device'), bezelEl = document.getElementById('bezel');
const place = (el, x, y, w, h) => { el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(y) + 'px'; if (w != null) el.style.width = Math.round(w) + 'px'; if (h != null) el.style.height = Math.round(h) + 'px'; };
/** Lays out the handheld for the window: upright (screen on top, buttons below) or wide (buttons either side). */
function fit() {
  const iw = innerWidth, ih = innerHeight, wide = iw > ih * 1.15, dpr = devicePixelRatio || 1;
  let Dw, Dh, side = 0;
  if (wide) { Dh = Math.min(ih, 640); Dw = Math.min(iw, Dh * 2.3); side = Math.min(Dw * 0.21, Dh * 0.48); }
  else { Dw = Math.min(iw, ih * 0.6, 540); Dh = Math.min(ih, Dw * 1.78); }
  const u = wide ? Dh / 100 : Dw / 100; // one layout unit
  const rimX = wide ? side : u * 6, top = wide ? u * 7 : u * 10;
  const bpX = u * (wide ? 8 : 9), bpT = u * (wide ? 4.5 : 7), bpB = u * (wide ? 4 : 6);
  const maxW = Dw - 2 * rimX - 2 * bpX, maxH = wide ? Dh - top - bpT - bpB - u * 16 : Dh * 0.42;
  const k = Math.min(maxW / W, maxH / H);
  // CSS pixels per art pixel: a whole number of device pixels, unless the screen is dense enough
  // (3 or more device pixels per art pixel) that an uneven pixel cannot be seen
  const s = k * dpr >= 3 ? k : Math.max(1, Math.floor(k * dpr)) / dpr;
  const cw = Math.round(W * s), ch = Math.round(H * s);
  place(deviceEl, (iw - Dw) / 2, (ih - Dh) / 2, Dw, Dh);
  deviceEl.style.borderRadius = `${u * 3}px ${u * 3}px ${u * (wide ? 10 : 15)}px ${u * 3}px`;
  // the top groove and the OFF-ON mark
  place(document.getElementById('groove'), 0, u * 5.5); place(document.getElementById('grooveL'), u * 6, 0, null, u * 5.5); place(document.getElementById('grooveR'), Dw - u * 6, 0, null, u * 5.5);
  const offon = document.getElementById('offon'); place(offon, u * 9, u * 1.4); offon.style.fontSize = Math.max(8, u * 2.3) + 'px';
  // the bezel: two stripes and a line of text along its top, the power light, the screen
  const bw = cw + 2 * bpX, bh = ch + bpT + bpB;
  const bx = (Dw - bw) / 2, by = top;
  place(bezelEl, bx, by, bw, bh); bezelEl.style.borderRadius = `${u * 2}px ${u * 2}px ${u * 9}px ${u * 2}px`;
  const sy = bpT * 0.45;
  place(document.getElementById('s1'), u * 2, sy - 2, bw - u * 4, 2); place(document.getElementById('s2'), u * 2, sy + 2, bw - u * 4, 2);
  const st = document.getElementById('stext'); place(st, bw / 2, sy + 1); st.style.fontSize = Math.max(7, u * 1.8) + 'px';
  place(screenEl, bpX, bpT, cw, ch);
  const led = bezelEl.querySelector('.led'); place(led, bpX / 2 - 4, bpT + ch * 0.32);
  const ll = bezelEl.querySelector('.ledlabel'); place(ll, bpX / 2, bpT + ch * 0.32 + 12); ll.style.fontSize = Math.max(6, u * 1.5) + 'px';
  // the name under the screen
  const brand = document.getElementById('brand'); brand.style.fontSize = Math.round(u * (wide ? 5 : 5.2)) + 'px';
  place(brand, bx + u * 1, by + bh + u * 1.2);
  canvas.width = W; canvas.height = H;
  for (const c of [canvas, hudCanvas]) { c.style.width = cw + 'px'; c.style.height = ch + 'px'; }
  hudScale = s * dpr;
  hudCanvas.width = Math.round(W * hudScale); hudCanvas.height = Math.round(H * hudScale);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  // the controls
  const ctop = by + bh + u * 8, ch2 = Dh - ctop;
  const ds = Math.min(160, u * (wide ? 30 : 32)), aS = u * (wide ? 12 : 13);
  let dx, dy, ax, ay, bx2, by2, selX, startX, pillY;
  if (wide) { dx = side / 2; dy = Dh * 0.48; ax = Dw - side * 0.28; ay = Dh * 0.42; bx2 = Dw - side * 0.62; by2 = Dh * 0.52; selX = side * 0.35; startX = side * 0.75; pillY = Dh * 0.82; }
  else { dx = Dw * 0.24; dy = ctop + ch2 * 0.24; ax = Dw * 0.82; ay = ctop + ch2 * 0.16; bx2 = Dw * 0.6; by2 = ctop + ch2 * 0.27; selX = Dw * 0.38; startX = Dw * 0.6; pillY = ctop + ch2 * 0.6; }
  if (wide) { startX = Dw - side * 0.5; selX = side * 0.5; }
  place(document.getElementById('dwell'), dx - ds * 0.62, dy - ds * 0.62, ds * 1.24, ds * 1.24);
  dpad.style.transform = `scale(${ds / 150})`; place(dpad, dx - ds / 2, dy - ds / 2);
  const bA = document.getElementById('bA'), bB = document.getElementById('bB');
  place(bA, ax - aS / 2, ay - aS / 2, aS, aS); place(bB, bx2 - aS / 2, by2 - aS / 2, aS, aS);
  const well = document.getElementById('abwell'), wl = Math.hypot(ax - bx2, ay - by2) + aS * 1.35, ang = Math.atan2(ay - by2, ax - bx2);
  place(well, (ax + bx2) / 2 - wl / 2, (ay + by2) / 2 - aS * 0.68, wl, aS * 1.36); well.style.transform = `rotate(${ang}rad)`;
  const labSize = Math.max(11, u * 3.4) + 'px', hintSize = Math.max(9, u * 2.4) + 'px';
  for (const [id, x, y] of [['lA', ax, ay + aS * 0.62], ['lB', bx2, by2 + aS * 0.62]]) { const e = document.getElementById(id); place(e, x, y); e.style.fontSize = labSize; }
  for (const [id, x, y] of [['hA', ax, ay + aS * 0.62 + u * 4.2], ['hB', bx2, by2 + aS * 0.62 + u * 4.2]]) { const e = document.getElementById(id); place(e, x, y); e.style.fontSize = hintSize; }
  const pw = u * 11, ph = u * 3;
  for (const [id, x] of [['bMute', selX], ['bStart', startX]]) { const e = document.getElementById(id); place(e, x - pw / 2, pillY - ph / 2, pw, ph); }
  for (const [id, x] of [['lMute', selX], ['lStart', startX]]) { const e = document.getElementById(id); place(e, x, pillY + u * 4.2); e.style.fontSize = Math.max(9, u * 2.4) + 'px'; }
  for (const [id, x] of [['hMute', selX], ['hStart', startX]]) { const e = document.getElementById(id); place(e, x, pillY + u * 8); e.style.fontSize = hintSize; }
  const gr = document.getElementById('grille');
  if (wide) gr.style.display = 'none';
  else {
    gr.style.display = 'block'; place(gr, Dw - u * 30, Dh - u * 22, u * 24, u * 16);
    [...gr.children].forEach((i, n) => { place(i, n * u * 3.6, 0, u * 1.4, u * 14); });
  }
}
addEventListener('resize', fit);
function rect(x, y, w, h, c) { ctx.fillStyle = col(c); ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function clear(c) { ctx.fillStyle = col(c); ctx.fillRect(0, 0, W, H); }
/** Sharp text on the HUD layer; x, y in art pixels (y is the middle of the line), size in art pixels. */
function text(s, x, y, size = 8, c = 0, align = 'left', outline = 3) {
  const k = hudScale;
  hctx.font = `800 ${Math.round(size * k)}px ${FONT}`; hctx.textAlign = align; hctx.textBaseline = 'middle';
  hctx.lineJoin = 'round';
  if (outline !== -1) { hctx.lineWidth = Math.max(2, size * k * 0.24); hctx.strokeStyle = col(outline); hctx.strokeText(String(s), (x + shakeX) * k, y * k); }
  hctx.fillStyle = col(c); hctx.fillText(String(s), (x + shakeX) * k, y * k);
}
function hudClear() { hctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height); }
// A 3x5 pixel font for the big score on the results screen
const DIG = { '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111', ':': '000010000010000' };
function digits(s, x, y, c = 3, scale = 1, align = 'left') {
  s = String(s); const w = s.length * 4 * scale - scale;
  let px = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  for (const ch of s) {
    const g = DIG[ch]; if (g) for (let i = 0; i < 15; i++) if (g[i] === '1') rect(px + (i % 3) * scale, y + Math.floor(i / 3) * scale, scale, scale, c);
    px += 4 * scale;
  }
}

// ---- Sprites: rows of colour letters (see COL), '.' is see-through; drawn facing right -----
const SPR = {
  usFlyer: [ // 그리핀도르: an orange hood, a short wing cape
    '......333', '.....3ooo3', '....3ooooo3', '....3oss3o3', '....3osss3', '.O...3oo3', '.OO.3oooos3',
    '.OOo3oooo0s3', '..3ooooo3', '..3oooo3', 'hhhhbbbbbbbbbbb', 'h.h.3..3', '....33'],
  rivalFlyer: [ // 슬리데린: a pointed hat and a gold beak
    '.......3', '......3p3', '.....3pp3', '....3ppp3', '...3333333', '....3tss3', '....3s3sYY',
    '.T..3sss3', '.TT3ttttt3', '..3tttt0t3', '.3ttttt3', 'hhhhbbbbbbbbbbb', 'h.h.3..3', '....33'],
  usKeeper: [ // big cream gloves
    '.....3333', '....3oooo3', '...3osssso3', '...3os3sso3', '...3ossss3', '.333oooooo333', '3ww3oooooo3ww3',
    '3ww3oo00oo3ww3', '.333oooooo333', '...3oooooo3', 'hhhhbbbbbbbbbbb', 'h.h.33..33', '....33..33'],
  rivalKeeper: [ // horned helmet
    '..g.......g', '..gg.3333.gg', '...33pppp33', '...3tsssst3', '...3ts3sst3', '.333tttttt333', '3ww3tttttt3ww3',
    '3ww3tttttt3ww3', '.333tttttt333', '...3tttttt3', 'hhhhbbbbbbbbbbb', 'h.h.33..33', '....33..33'],
  usBeater: [ // a bat held high
    '......333..33', '.....3ooo33bb3', '....3ooooo3bb3', '....3oss3o3b3', '....3osss3sb', '.O...3oo3s3', '.OO.3oooooo3',
    '.OOo3oooo03', '..3ooooo3', '..3oooo3', 'hhhhbbbbbbbbbbb', 'h.h.3..3', '....33'],
  usBeaterSwing: [ // the swing: bat out in front
    '......333', '.....3ooo3', '....3ooooo3', '....3oss3o3', '....3osss3', '.O...3oo3...3333', '.OO.3ooooosbbbbb3',
    '.OOo3oooo0s.3333', '..3ooooo3', '..3oooo3', 'hhhhbbbbbbbbbbb', 'h.h.3..3', '....33'],
  usSeeker: [ // slim, goggles, a long striped scarf
    '.......333', '......3ooo3', '.....3ooooo3', '.....3oyyyo3', '.....3osss3', 'yoyo.y3oo3', '..oyoy3ooos3',
    '......3oo0s3', '.....3ooo3', '.....3oo3', 'hhhhbbbbbbbbbbb', 'h.h.3..3', '....33'],
  volla: ['..333..', '.3rrr3.', '3rr0rr3', '3r0rrR3', '3rrr0R3', '.3RRR3.', '..333..'],
  rumbler: ['....f....', '.f.333.f.', '..33333..', '.33g3333.', 'f3g33333f', '.3333333.', '..33333..', '.f.333.f.', '....f....'],

      rect(gx - 1, hy + half + 2, 2, FLOOR - hy - half - 2, 'b'); rect(gx + 1, hy + half + 2, 1, FLOOR - hy - half - 2, 'R');
      for (let y = -half - 1; y <= half + 1; y++) {
        const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / (half + 1)) ** 2)) * 3);
        rect(gx - w - 1, hy + y, 1, 1, '3'); rect(gx - w, hy + y, 1, 1, hit ? 'w' : 'y'); rect(gx + w, hy + y, 1, 1, hit ? 'w' : 'Y'); rect(gx + w + 1, hy + y, 1, 1, '3');
      }
      rect(gx - 2, hy - half - 7, 5, 5, '3');
      const lit = state.lantern[String(side)] > 0 && Math.floor(tNow * 10) % 2 === 0;
      rect(gx - 1, hy - half - 6, 3, 3, lit ? 'w' : 'y');
      if (lit) { rect(gx - 4, hy - half - 5, 1, 1, 'w'); rect(gx + 4, hy - half - 5, 1, 1, 'w'); rect(gx, hy - half - 10, 1, 1, 'w'); }
    });
  }
}
function ip(e, a) { return { x: lerp(e.px, e.x, a), y: lerp(e.py, e.y, a) }; }
const SPR_OF = r => {
  const t = r.team === 0 ? 'us' : 'rival';
  if (r.role === 'keeper') return t + 'Keeper';
  if (r.role === 'beater') return t + (r.swing > 0 ? 'BeaterSwing' : 'Beater');
  if (r.role === 'seeker') return t + 'Seeker';
  return t + 'Flyer';
};
function drawPlay(a) {
  const tNow = clock.now();
  shakeX = state.shake > 0 ? Math.round(Math.sin(tNow * 60) * tune.shake) : 0;
  const cam = lerp(state.camPX, state.camX, a) + shakeX, cx = Math.round(cam);
  drawWorld(cam, tNow);
  const R = RD(), b = state.ball, g = state.glimmer;
  // the shot's trail
  b.trail.forEach((p, i) => { if (i % 2 === 0) rect(p.x - cx - 1, p.y - 1, b.perfect ? 3 : 2, b.perfect ? 3 : 2, b.perfect ? 'y' : 'w'); });
  for (const r of R) {
    const p = ip(r, a), bob = r.role === 'flyer' ? Math.round(Math.sin(tNow * 4 + r.bob)) : 0;
    const blink = r.stun > 0 && Math.floor(tNow * 14) % 2 === 0;
    if (r.dashT > 0) for (let k = 1; k <= 3; k++) rect(p.x - cx - r.dx * k * 5, p.y + 4 - r.dy * k * 3, 3, 1, 'w');
    if (trailing(r.team) && r.role === 'flyer' && Math.floor(tNow * 8 + r.id) % 3 === 0) rect(p.x - cx - r.face * 10, p.y + 5, 1, 1, 'y'); // the catch-up sparkle
    if (!blink) drawSpr(SPR_OF(r), p.x - cx, p.y + bob, r.face < 0);
    if (r.id === 0) { // you: a little arrow above
      const ay = Math.round(p.y + bob - 13 + Math.sin(tNow * 6));
      rect(p.x - cx - 2, ay, 5, 1, 'y'); rect(p.x - cx - 1, ay + 1, 3, 1, 'y'); rect(p.x - cx, ay + 2, 1, 1, 'y');
      rect(p.x - cx - 3, ay - 1, 7, 1, '3');
    }
  }
  const bp = ip(b, a);
  drawSpr('volla', bp.x - cx, bp.y);
  for (const rb of state.rumblers) if (rb.active) { const p = ip(rb, a); drawSpr('rumbler', p.x - cx, p.y, Math.floor(tNow * 8) % 2 === 0); }
  if (g.active) { const p = ip(g, a); drawSpr(Math.floor(tNow * 16) % 2 ? 'glimmerA' : 'glimmerB', p.x - cx, p.y); }
  pointer(bp.x - cx, bp.y, 'r');
  if (g.active) pointer(g.x - cx, g.y, 'y');
  drawHUD();
}
function pointer(sx, sy, c) { // an arrow at the edge toward the ball or the glimmer
  if (sx >= 2 && sx <= W - 2) return;
  const left = sx < 2, x = left ? 3 : W - 4, y = clamp(Math.round(sy), TOP + 6, FLOOR - 6);
  for (let i = 0; i < 4; i++) { rect(left ? x + i : x - i, y - i - 1, 1, i * 2 + 3, '3'); rect(left ? x + i : x - i, y - i, 1, i * 2 + 1, c); }
}
function drawHUD() {
  const st = state;
  rect(0, 0, W, 14, '3'); rect(0, 14, W, 1, '#3b2f5c');
  drawSpr('hawk', 8, 7); drawSpr('crow', W - 8, 7, true);
  text(TEAMS_SHORT[0] + ' ' + st.score[0], 15, 7, 8, 'y', 'left', -1);
  text(st.score[1] + ' ' + TEAMS_SHORT[1], W - 15, 7, 8, '#9fe0b0', 'right', -1);
  const left = Math.max(0, Math.ceil(tune.matchTime - st.t)), mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, '0');
  if (!(left <= 10 && Math.floor(st.t * 4) % 2 === 0)) text(`${mm}:${ss}`, W / 2, 6.5, 9, 0, 'center', -1);
  if (!st.glimmer.active) { // a bar filling toward the glimmer
    const f = clamp(st.t / tune.glimmerAt, 0, 1); rect(W / 2 - 16, 12, 32, 2, '#3b2f5c'); rect(W / 2 - 16, 12, Math.round(32 * f), 2, 'y');
  }
  if (trailing(0) && Math.floor(st.t * 3) % 2 === 0) { rect(W / 2 - 22, 3, 1, 7, 'y'); rect(W / 2 - 23, 4, 3, 1, 'y'); rect(W / 2 - 24, 5, 5, 1, 'y'); } // the catch-up arrow
  const me = st.riders[0];
  if (st.charging) { // the throw meter: a tap passes, holding throws further
    const c = clamp(st.holdT / tune.chargeTime, 0, 1), x0 = W / 2 - 40, y0 = FLOOR - 18;
    rect(x0 - 2, y0 - 2, 84, 9, '3'); rect(x0, y0, 80, 5, '#3b2f5c'); rect(x0, y0 + 1, Math.round(80 * c), 3, c >= 1 ? 'y' : 'o');
    text(st.holdT < tune.tapTime ? '떼면 패스' : '떼면 멀리 던지기', W / 2, y0 - 9, 9, 0, 'center');
  }
  if (me.stun > 0) text('휘청!', W / 2, FLOOR - 34, 10, 'f', 'center');
  for (const m of st.msgs) text(m.s, W / 2, 46, 16, 'y', 'center');
  const T = touchMode;
  const tips = [T ? '당신은 파수꾼! 십자키로 골대를 지켜요' : '당신은 파수꾼! 방향키로 골대를 지켜요',
    T ? '슛이 오면 몸으로 막아요 · B: 몸 날리기' : '슛이 오면 몸으로 막아요 · X: 몸 날리기',
    T ? '퀘이플을 잡으면 A 짧게: 추격꾼에게 패스' : '퀘이플을 잡으면 Z 짧게: 추격꾼에게 패스',
    T ? 'A 길게 눌렀다 떼면 멀리 던지기' : 'Z 길게 눌렀다 떼면 멀리 던지기'];
    if (st.tut < tips.length && st.t < 45 && st.msgs.length === 0 && !(st.tut === 0 && st.t > 12)) {
    rect(0, 15, W, 13, 'rgba(26,16,48,0.55)'); text(tips[st.tut], W / 2, 21.5, 8, 0, 'center');
  }
  if (st.glimmerNote > 0 && st.msgs.length === 0) { rect(0, 15, W, 13, 'rgba(26,16,48,0.55)'); text('수색꾼이 잡으면 +' + tune.glimmerPoints + '점, 경기 끝!', W / 2, 21.5, 8, 'y', 'center'); }
}
const TEAMS_SHORT = ['그리핀도르', '슬리데린'];
function panel(x, y, w, h) { rect(x, y, w, h, '3'); rect(x + 1, y + 1, w - 2, h - 2, '0'); rect(x + 2, y + 2, w - 4, h - 4, '3'); rect(x + 3, y + 3, w - 6, h - 6, '#2a2045'); }
function drawTitle() {
  const tNow = clock.now();
  drawWorld(((tNow * 20) % (tune.fieldWidth - W)), tNow);
  panel(16, 18, W - 32, 30);
  text(TITLE, W / 2, 33, 17, 'y', 'center');
  drawSpr('usFlyer', 46 + Math.sin(tNow * 2) * 4, 62 + Math.round(Math.sin(tNow * 3) * 2));
  drawSpr('volla', 56 + Math.sin(tNow * 2) * 4, 64 + Math.round(Math.sin(tNow * 3) * 2));
  drawSpr('rivalFlyer', W - 52 + Math.sin(tNow * 2 + 1) * 4, 64 + Math.round(Math.sin(tNow * 3 + 1) * 2), true);
  drawSpr(Math.floor(tNow * 16) % 2 ? 'glimmerA' : 'glimmerB', W / 2 + Math.cos(tNow * 1.7) * 24, 60 + Math.sin(tNow * 2.3) * 5);
  const lines = touchMode ? TOUCH_CONTROLS : CONTROLS;
  const y0 = 80;
  panel(12, y0, W - 24, lines.length * 11 + 10);
  lines.forEach((l, i) => text(l, 22, y0 + 10 + i * 11, 8, 0, 'left', -1));
  if (Math.floor(tNow * 2) % 2 === 0) text(touchMode ? '화면이나 START를 눌러 시작' : 'Enter를 눌러 시작', W / 2, 148, 10, 'w', 'center');
}

// ---- Scenes ------------------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear('#8cc8f2'); rect(0, 0, W, 16, '3'); text('퀴디치 포켓의 선수와 공', W / 2, 8, 9, 'y', 'center', -1);
      const items = [['usKeeper', '그리핀도르', '파수꾼'], ['usFlyer', '그리핀도르', '추격꾼'], ['usBeater', '그리핀도르', '몰이꾼'], ['usSeeker', '그리핀도르', '수색꾼'],
        ['rivalKeeper', '슬리데린', '파수꾼'], ['rivalFlyer', '슬리데린', '추격꾼'], ['rivalBeater', '슬리데린', '몰이꾼'], ['rivalSeeker', '슬리데린', '수색꾼'],
        ['volla', '퀘이플', ''], ['rumbler', '블러저', ''], ['glimmerA', '골든 스니치', ''], ['usBeaterSwing', '몰이꾼', '방망이질']];
      items.forEach(([s, n1, n2], i) => {
        const colN = i % 4, row = Math.floor(i / 4), x = 28 + colN * 51, y = 36 + row * 43;
        const c = sprite(s, false); ctx.drawImage(c, 0, 0, c.width, c.height, Math.round(x - c.width * 0.75), Math.round(y - c.height * 0.75), Math.round(c.width * 1.5), Math.round(c.height * 1.5));
        text(n1, x, y + 15, 7, 0, 'center'); if (n2) text(n2, x, y + 23, 7, 'y', 'center');
      });
    },
  },
  title: {
    update() { if (startHit() || aHit()) { reset(); scene = 'play'; } },
    draw() { drawTitle(); },
  },
  play: {
    update(dt) {
      if (startHit()) { scene = 'pause'; return; }
      updateMatch(dt);
    },
    draw() { drawPlay(ALPHA); },
  },
  pause: {
    update() { if (startHit()) scene = 'play'; },
    draw() {
      drawPlay(1); dither(0, 15, W, H - 15, '3', 2);
      panel(W / 2 - 60, 58, 120, 42);
      text('일시정지', W / 2, 72, 13, 'y', 'center'); text(touchMode ? 'START를 누르면 계속' : 'Enter를 누르면 계속', W / 2, 88, 8, 0, 'center', -1);
    },
  },
  results: {
    update(dt) {
      state.resultsT += dt;
      for (const e of [...RD(), state.ball, ...state.rumblers, state.glimmer]) { e.px = e.x; e.py = e.y; }
      state.camPX = state.camX;
      if (state.resultsT > 0.8 && (startHit() || aHit())) { reset(); scene = 'play'; }
    },
    draw() {
      drawPlay(1);
      panel(14, 22, W - 28, 120);
      const st = state, head = st.winner === 0 ? '승리!' : st.winner === 1 ? '패배' : '무승부';
      text(head, W / 2, 42, 18, st.winner === 0 ? 'y' : st.winner === 1 ? '#9fd0e8' : 'w', 'center');
      text(st.gained.replace(/^\S+\s/, ''), W / 2, 60, 9, 0, 'center', -1);
      drawSpr('hawk', W / 2 - 50, 80); drawSpr('crow', W / 2 + 50, 80, true);
      digits(st.score[0], W / 2 - 8, 74, 'y', 3, 'right'); digits(st.score[1], W / 2 + 8, 74, '#9fe0b0', 3, 'left'); rect(W / 2 - 1, 78, 2, 2, '0'); rect(W / 2 - 1, 84, 2, 2, '0');
      text(`선방 ${st.stats.saves} · 실점 ${st.stats.conceded}`, W / 2, 101, 8, 0, 'center', -1);
      text(`패스 ${st.stats.passes} · 블러저에 맞음 ${st.stats.hits}`, W / 2, 112, 8, 0, 'center', -1);
      if (st.resultsT > 0.8 && Math.floor(clock.now() * 2) % 2 === 0) text(touchMode ? '눌러서 다시 하기' : 'Enter를 눌러 다시 하기', W / 2, 130, 10, 'w', 'center');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() {
  hudClear(); shakeX = 0;
  scenes[scene].draw();
  const mb = document.getElementById('hMute'); if (mb) mb.textContent = muted ? '소리 켜기' : '소리 끄기';
}
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
