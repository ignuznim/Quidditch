<script>
'use strict';
// 스카이훅: an original sky sport on brooms. Three balls in one sky: score with the 볼라 through
// the hoops, dodge the two 럼블러, and catch the golden 글리머 to end the match.
// 3D is drawn by three.js on #view; the HUD, touch controls and screens on #game above it.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size of the HUD
const PIXEL = false;
const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif';
const TITLE = '스카이훅';
const CONTROLS = [
  'WASD / 방향키: 좌우 선회 · 상승 · 하강',
  'Shift: 가속 (급강하하면 더 빨라요)',
  'Space 짧게: 패스 · 길게 눌렀다 떼기: 파워 슛 · 공이 없을 때: 빼앗기',
  'E: 공에 가까운 선수로 · Tab: 추격수 (글리머 등장 후)',
  'P: 일시정지 · M: 소리 끄기',
];
const TOUCH_CONTROLS = [
  '왼쪽 조이스틱: 선회 · 상승 · 하강',
  '슛: 짧게 = 패스, 길게 = 파워 슛, 공 없을 때 = 빼앗기',
  '가속 · 바꾸기 · 추격수 버튼',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Small maths ----------------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function wrapAngle(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z); }
function norm(x, y, z) { const l = Math.hypot(x, y, z) || 1; return { x: x / l, y: y / l, z: z / l }; }
/** Unit forward vector of a rider from its yaw and pitch (yaw 0 faces +z). */
function fwd(r) { const c = Math.cos(r.pitch); return { x: Math.sin(r.yaw) * c, y: Math.sin(r.pitch), z: Math.cos(r.yaw) * c }; }

// ---- Teams and the pitch --------------------------------------------------------------
const TEAMS = [
  { name: '등불매', dir: 1, css: '#ffb054', robe: 0xe9853a, trim: 0xfff0d2 },     // attacks the +z hoops
  { name: '폭풍까마귀', dir: -1, css: '#4fd3c4', robe: 0x1d6c68, trim: 0xb9c7d2 }, // attacks the -z hoops
];
const ROLE_NAME = { chaser: '득점수', seeker: '추격수', keeper: '골키퍼' };
/** The three hoops at one end of the pitch; side is +1 or -1. */
function hoops(side) {
  const z = side * tune.goalDistance;
  return [{ x: -9, y: 13, z }, { x: 0, y: 18, z }, { x: 9, y: 13, z }];
}

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const glCanvas = document.getElementById('view');
let viewScale = 1, viewLeft = 0, viewTop = 0;
function fit() { // fills the window at any size and pixel ratio; the 3D view sits under the HUD
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = k;
  const r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  const cw = Math.round(W * s), ch = Math.round(H * s);
  viewScale = s; viewLeft = Math.floor((innerWidth - cw) / 2); viewTop = Math.max(0, Math.floor((innerHeight - ch) / 2));
  for (const c of [canvas, glCanvas]) {
    c.style.width = cw + 'px'; c.style.height = ch + 'px';
    c.style.left = viewLeft + 'px'; c.style.top = viewTop + 'px';
  }
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
  if (V) V.renderer.setSize(cw, ch, false);
}
addEventListener('resize', fit);
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = '600') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.16); ctx.strokeStyle = 'rgba(12,8,30,0.85)';
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function panel(x, y, w, h, r = 14, fill = 'rgba(18,12,40,0.62)') {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code === 'Tab' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => { down.clear(); stick = null; pointers.clear(); });

// ---- Touch: a joystick on the left half, buttons on the right ---------------------------
let touchMode = params.get('touch') === '1';
let stick = null;                 // { id, ox, oy, x, y } in HUD pixels
const pointers = new Map();       // pointerId -> 'stick' | key code held by a button
const BUTTONS = [
  { code: 'Space', label: '슛', sub: '패스', x: 1135, y: 585, r: 74 },
  { code: 'ShiftLeft', label: '가속', x: 985, y: 640, r: 52 },
  { code: 'KeyE', label: '바꾸기', x: 1000, y: 488, r: 44 },
  { code: 'Tab', label: '추격수', x: 1160, y: 432, r: 44 },
  { code: 'KeyP', label: 'II', x: 1236, y: 44, r: 28, small: true },
  { code: 'KeyM', label: '소리', x: 1172, y: 44, r: 28, small: true, drawn: 'note' },
];
function toHud(e) { return { x: (e.clientX - viewLeft) / viewScale, y: (e.clientY - viewTop) / viewScale }; }
function buttonAt(p) {
  for (const b of BUTTONS) if (Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.18) return b;
  return null;
}
addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') touchMode = true;
  const p = toHud(e);
  if (scene !== 'play') {
    if (touchMode && scene === 'pause') { hit.add('KeyP'); return; }
    if (touchMode && Math.hypot(p.x - 1172, p.y - 44) < 34) { hit.add('KeyM'); return; }
    hit.add('Enter'); return; // title and results: a tap or click starts
  }
  if (e.pointerType === 'mouse' && !touchMode) return;
  e.preventDefault();
  const b = buttonAt(p);
  if (b) { pointers.set(e.pointerId, b.code); down.add(b.code); hit.add(b.code); return; }
  if (p.x < W * 0.55 && !stick) { stick = { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y }; pointers.set(e.pointerId, 'stick'); }
}, { passive: false });
addEventListener('pointermove', e => {
  if (stick && e.pointerId === stick.id) { const p = toHud(e); stick.x = p.x; stick.y = p.y; }
});
function pointerEnd(e) {
  const what = pointers.get(e.pointerId);
  if (what === 'stick') stick = null;
  else if (what) down.delete(what);
  pointers.delete(e.pointerId);
}
addEventListener('pointerup', pointerEnd);
addEventListener('pointercancel', pointerEnd);
addEventListener('contextmenu', e => e.preventDefault());
function stickAxes() {
  if (!stick) return { x: 0, y: 0 };
  const R = tune.stickRadius;
  let dx = (stick.x - stick.ox) / R, dy = -(stick.y - stick.oy) / R;
  const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  if (l < 0.12) return { x: 0, y: 0 };
  return { x: dx, y: dy };
}

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
    try { // a noise buffer for wind, whooshes and the crowd
      const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      let s = 12345; for (let i = 0; i < len; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
      audio.noise = buf;
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.7;
      const g = ac.createGain(); g.gain.value = 0;
      src.connect(f).connect(g).connect(out); src.start();
      audio.wind = { f, g };
    } catch (e) { /* no wind: the rest still plays */ }
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}
function whoosh(dur, from, to, vol = 0.35, delay = 0) {
  if (!audio || muted || !audio.noise) return;
  const ac = audio.ac, t = ac.currentTime + delay, src = ac.createBufferSource(); src.buffer = audio.noise;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.25);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(audio.out); src.start(t, rngAudio() * 1.5); src.stop(t + dur + 0.05);
}
let audioSeed = 7; function rngAudio() { audioSeed = (audioSeed * 16807) % 2147483647; return audioSeed / 2147483647; } // sound only, never gameplay
const SFX = {
  pass() { tone(620, 0.09, 'triangle', 0.22); whoosh(0.22, 900, 2200, 0.12); },
  catch() { tone(420, 0.07, 'triangle', 0.18); },
  shot(p) { whoosh(0.5, 400, 3000, 0.4); tone(p ? 880 : 300, 0.25, 'sawtooth', 0.12); },
  perfect() { [660, 880, 1320].forEach((f, i) => tone(f, 0.25, 'triangle', 0.2, i * 0.05)); },
  goal() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.5, 'triangle', 0.25, i * 0.09)); whoosh(1.6, 300, 900, 0.3, 0.1); },
  conceded() { [392, 330, 262].forEach((f, i) => tone(f, 0.35, 'triangle', 0.18, i * 0.12)); },
  save() { tone(180, 0.15, 'square', 0.18); whoosh(0.2, 1500, 400, 0.15); },
  thud() { tone(85, 0.35, 'sawtooth', 0.35); whoosh(0.3, 300, 120, 0.3); },
  steal() { tone(500, 0.08, 'square', 0.18); tone(760, 0.1, 'square', 0.16, 0.06); },
  miss() { whoosh(0.18, 1200, 600, 0.12); },
  bell() { [1320, 1760, 1320, 1760].forEach((f, i) => tone(f, 0.6, 'sine', 0.2, i * 0.18)); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.6, 'triangle', 0.25, i * 0.12)); },
  lose() { [440, 392, 349, 262].forEach((f, i) => tone(f, 0.6, 'triangle', 0.2, i * 0.16)); },
};

// ---- The match state ------------------------------------------------------------------
// Everything gameplay lives in `state` as plain numbers; the 3D view only reads it.
let scene, state;
function mkRider(id, team, role, x, y, z) {
  return { id, team, role, x, y, z, px: x, py: y, pz: z, yaw: team === 0 ? 0 : Math.PI, pitch: 0, roll: 0,
    speed: tune.flySpeed * 0.8, stamina: 1, boosting: false, stun: 0, cd: 0, immune: 0, holdT: 0, aiT: 0,
    sx: x, sy: y, sz: z }; // sx..sz: the seeker's last look at the glimmer
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  const gd = tune.goalDistance;
  const R = [
    mkRider(0, 0, 'chaser', -5, 15, -8), mkRider(1, 0, 'chaser', 7, 17, -16),
    mkRider(2, 0, 'seeker', 0, 28, -24), mkRider(3, 0, 'keeper', 0, 15, -(gd - 3.5)),
    mkRider(4, 1, 'chaser', -8, 16, 30), mkRider(5, 1, 'chaser', 9, 15, 38),
    mkRider(6, 1, 'seeker', 0, 29, 26), mkRider(7, 1, 'keeper', 0, 15, gd - 3.5),
  ];
  R[0].immune = tune.kickoffGrace; // the kickoff: time to try the controls with the ball
  state = {
    t: 0, score: [0, 0], gained: '', over: false, winner: -1, endReason: '',
    riders: R, ctrl: 0, seekerLock: false, switchT: 0,
    charging: false, holdT: 0, actPrev: false, buffer: 0,
    ball: { x: 0, y: 15, z: 0, px: 0, py: 15, pz: 0, vx: 0, vy: 0, vz: 0, holder: 0, mode: 'held', team: 0,
      passTo: -1, age: 0, saveTried: false, lastHolder: 0, perfect: false, tried: [] },
    rumblers: [
      { x: -26, y: 22, z: 0, px: -26, py: 22, pz: 0, vx: 0, vy: 0, vz: 0, active: false, rest: 0, target: -1, retarget: 0, spin: 0 },
      { x: 26, y: 22, z: 0, px: 26, py: 22, pz: 0, vx: 0, vy: 0, vz: 0, active: false, rest: 0, target: -1, retarget: 0, spin: 0 },
    ],
    glimmer: { active: false, x: 0, y: 25, z: 0, px: 0, py: 25, pz: 0, vx: 0, vy: 0, vz: 0, turnT: 0, dartT: 0, flap: 0 },
    cam: { x: -5, y: 18, z: -16, px: -5, py: 18, pz: -16, lx: 0, ly: 15, lz: 0, plx: 0, ply: 15, plz: 0, fov: tune.fovBase },
    msgs: [], flash: { '1': [0, 0, 0], '-1': [0, 0, 0] },
    tut: 0, tutT: 0, glimmerNote: 0, resultsT: 0,
    stats: { goals: 0, perfect: 0, steals: 0, hits: 0, saves: 0 },
  };
  stick = null;
}
const R = () => state.riders;
function ramp() { return clamp((state.t - tune.laxUntil) / Math.max(1, tune.rampUntil - tune.laxUntil), 0, 1); }
function msg(text, color = '#fff', dur = 2) {
  state.msgs.push({ text, color, t: dur, dur });
  if (state.msgs.length > 3) state.msgs.shift();
}
function trailing(team) { return state.score[team] < state.score[1 - team]; }

// ---- Flight --------------------------------------------------------------------------
/** Moves one rider for a step: self-levelling arcade broom, dive for speed, soft walls. */
function fly(r, ix, iy, boost, dt, mult) {
  if (r.stun > 0) { ix = clamp(ix * 0.3 + Math.sin(state.t * 19 + r.id) * 0.7, -1, 1); iy *= 0.3; boost = false; mult *= 0.6; }
  r.boosting = boost && r.stamina > 0.04;
  r.stamina = clamp(r.stamina + (r.boosting ? -tune.boostDrain : tune.boostRegen) * dt, 0, 1);
  r.yaw = wrapAngle(r.yaw - ix * tune.turnRate * dt);
  r.pitch += (iy * tune.pitchMax - r.pitch) * Math.min(1, tune.pitchResponse * dt);
  r.roll += (-ix * 0.62 - r.roll) * Math.min(1, 6 * dt);
  const dive = -Math.sin(r.pitch) / Math.sin(tune.pitchMax);
  const target = (tune.flySpeed * (r.boosting ? tune.boostMult : 1) + dive * tune.diveGain) * mult;
  r.speed += (target - r.speed) * Math.min(1, tune.speedResponse * dt);
  r.speed = Math.max(3, r.speed);
  const f = fwd(r);
  r.x += f.x * r.speed * dt; r.y += f.y * r.speed * dt; r.z += f.z * r.speed * dt;
  bound(r);
}
function bound(r) { // walls and ground bounce and slow, never wreck
  const hw = tune.arenaHalfWidth, hl = tune.arenaHalfLength;
  if (r.y < tune.floor) { r.y = tune.floor; if (r.pitch < 0) { r.pitch = Math.abs(r.pitch) * 0.4; r.speed *= tune.wallSlow; } }
  if (r.y > tune.ceiling) { r.y = tune.ceiling; if (r.pitch > 0) r.pitch = -r.pitch * 0.3; }
  if (Math.abs(r.x) > hw) { r.x = Math.sign(r.x) * hw; r.yaw = wrapAngle(-r.yaw); r.speed *= tune.wallSlow; }
  if (Math.abs(r.z) > hl) { r.z = Math.sign(r.z) * hl; r.yaw = wrapAngle(Math.PI - r.yaw); r.speed *= tune.wallSlow; }
}
/** AI steering: turns the target point into stick input, then flies like the player. */
function steer(r, tx, ty, tz, dt, mult, boost = false) {
  const dx = tx - r.x, dy = ty - r.y, dz = tz - r.z, hd = Math.hypot(dx, dz) || 0.001;
  const dyaw = wrapAngle(Math.atan2(dx, dz) - r.yaw);

}
function speedMult(r) {
  let m = 1;

  if (r.role === 'seeker') {
    m *= tune.seekerBoost;
    if (r.id !== state.ctrl) m *= r.team === 1 ? tune.enemySeekerSkill * lerp(0.8, 1, ramp()) : tune.mateSeekerSkill;
  }
  if (trailing(r.team)) m *= tune.catchUpMult;

// ---- The ball: give, pass, shoot ----------------------------------------------------------
function give(r, how) {
  const b = state.ball;
  b.holder = r.id; b.mode = 'held'; b.team = r.team; b.passTo = -1; b.lastHolder = r.id; b.tried = [];
  r.immune = tune.stealImmunity; r.holdT = 0;
  if (r.team === 0 && r.role === 'chaser' && !state.seekerLock && state.ctrl !== r.id) { state.ctrl = r.id; state.charging = false; }
  if (r.id === state.ctrl && state.buffer > 0) { state.charging = true; state.holdT = 0; state.buffer = 0; } // a press just before the catch counts
  events.push({ type: 'catch', how, rider: r.id, t: state.t });
  if (how === 'save') { SFX.save(); if (r.team === 0) { msg('선방!', TEAMS[0].css); state.stats.saves++; } else msg('상대 골키퍼가 막았다', TEAMS[1].css); }
  else if (how === 'steal') { SFX.steal(); }
  else if (how === 'intercept') { SFX.steal(); msg(r.team === 1 ? '패스를 가로채였다!' : '패스를 가로챘다!', TEAMS[r.team].css); }
  else if (r.team === 0) SFX.catch();
}
function release(r) {
  const b = state.ball; b.holder = -1; b.age = 0; b.lastHolder = r.id; b.team = r.team; b.saveTried = false; b.tried = [];
  const f = fwd(r); b.x = r.x + f.x * 1.6; b.y = r.y + f.y * 1.6; b.z = r.z + f.z * 1.6;
}
function passTarget(r) {
  const f = fwd(r); let best = null, bs = -1e9;
  for (const m of R()) {
    if (m === r || m.team !== r.team || m.role !== 'chaser' || m.stun > 0) continue;
    const dx = m.x - r.x, dy = m.y - r.y, dz = m.z - r.z, d = Math.hypot(dx, dy, dz) || 1;
    const ang = Math.acos(clamp((dx * f.x + dy * f.y + dz * f.z) / d, -1, 1));
    const s = (ang < tune.passCone ? 100 : 0) - ang * 20 - d * 0.3;
    if (s > bs) { bs = s; best = m; }

}
function pass(r, to) {

  const blink = 0.6 + Math.sin(clock.now() * 4) * 0.4; ctx.globalAlpha = blink;
  text(touchMode ? '화면을 눌러 시작' : 'Enter 또는 Space로 시작 (화면을 눌러도 돼요)', W / 2, H - 70, 28, '#fff', 'center', '800');
  ctx.globalAlpha = 1;
  if (innerHeight > innerWidth) text('휴대폰을 가로로 돌리면 더 크게 보여요', W / 2, H - 28, 18, '#ffd9a0');
  if (!V) text('이 브라우저에서 3D(WebGL)를 쓸 수 없어요', W / 2, H - 110, 20, '#ff9a8a');
}

// ---- Scenes ---------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      ctx.clearRect(0, 0, W, H);
      if (!V) { clear('#1c1636'); text('WebGL 없음', W / 2, H / 2, 30, '#fff'); return; }
      V.riders.forEach(m => m.visible = false); V.ball.visible = false; V.rumblers.forEach(m => m.visible = false); V.glimmer.visible = false; V.marker.visible = false;
      V.shadows.forEach(s => s.visible = false); V.trail.forEach(s => s.material.opacity = 0); V.gtrail.forEach(s => s.material.opacity = 0);
      V.lineup.visible = true;
      V.camera.position.set(0, 70.4, 17); V.camera.lookAt(0, 70.4, 0); V.camera.fov = 50; V.camera.updateProjectionMatrix();
      render3D();
      V.figs.forEach(([name, m], i) => { const p = project({ x: m.position.x, y: m.position.y - (i < 6 ? 1.0 : 1.9), z: 0 }); text(name, p.x, p.y, 17, '#fff3dc'); });
      text('스카이훅의 선수와 공', W / 2, 40, 26, '#ffe3a6', 'center', '800');
    },
  },
  title: {
    update(dt) {
      state.titleT = (state.titleT || 0) + dt;
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; }
    },
    draw() {
      if (V) {
        syncView(1);
        const a = (state.titleT || 0) * 0.08;
        V.camera.position.set(Math.sin(a) * 70, 34, Math.cos(a) * 70 - 10); V.camera.lookAt(0, 16, 0); V.camera.fov = 60; V.camera.updateProjectionMatrix();
        V.marker.visible = false; render3D();
      }
      drawTitleOverlay();
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      updateMatch(dt);
    },
    draw() {
      ctx.clearRect(0, 0, W, H);
      if (V) { syncView(ALPHA); render3D(); } else clear('#1c1636');
      drawHUD();
    },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || pressed('Enter')) scene = 'play'; },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(15,10,35,0.55)'; ctx.fillRect(0, 0, W, H);
      text('일시정지', W / 2, H / 2 - 20, 54, '#fff', 'center', '800');
      text(touchMode ? '화면을 누르면 계속' : 'P 또는 Enter로 계속', W / 2, H / 2 + 40, 24, '#efe4d2');
    },
  },
  results: {
    update(dt) {
      state.resultsT += dt;
      for (const e of [...state.riders, state.ball, ...state.rumblers, state.glimmer, state.cam]) { e.px = e.x; e.py = e.y; e.pz = e.z; }
      const c = state.cam; c.plx = c.lx; c.ply = c.ly; c.plz = c.lz;
      if (state.resultsT > 0.8 && (pressed('Enter') || pressed('Space'))) { reset(); scene = 'play'; }
    },
    draw() {
      ctx.clearRect(0, 0, W, H);
      if (V) { syncView(1); render3D(); }
      drawScoreboard();
      ctx.fillStyle = 'rgba(15,10,35,0.45)'; ctx.fillRect(0, 0, W, H);
      const st = state, win = st.winner;
      panel(W / 2 - 330, 150, 660, 400, 22, 'rgba(22,14,48,0.86)');
      const head = win === 0 ? '승리!' : win === 1 ? '패배' : '무승부';
      text(head, W / 2, 210, 64, win === 0 ? '#ffd27a' : win === 1 ? '#a8d8f0' : '#fff', 'center', '900');
      text(st.gained.replace(/^\S+\s+/, ''), W / 2, 268, 22, '#efe4d2');
      drawHawk(W / 2 - 200, 330, 1.8, TEAMS[0].css); drawRaven(W / 2 + 200, 330, 1.8, TEAMS[1].css);
      text(`${st.score[0]}  :  ${st.score[1]}`, W / 2, 330, 52, '#fff6e2', 'center', '800');
      const s = st.stats;
      text(`골 ${s.goals} · 완벽한 슛 ${s.perfect} · 빼앗기 ${s.steals} · 선방 ${s.saves} · 럼블러에 맞음 ${s.hits}`, W / 2, 400, 20, '#ffe0b8');
      text(`경기 시간 ${fmtTime(st.t)}`, W / 2, 440, 18, '#d8ccb8');
      if (st.resultsT > 0.8) text(touchMode ? '화면을 눌러 다시 하기' : 'Enter로 다시 하기 (화면을 눌러도 돼요)', W / 2, 505, 26, '#fff', 'center', '800');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() {
  scenes[scene].draw();
  if (audio && audio.wind && state) { // the wind rises with speed
    const me = state.riders[state.ctrl], sp = scene === 'play' ? clamp(me.speed / (tune.flySpeed * 1.8), 0, 1) : 0;
    audio.wind.g.gain.value = muted ? 0 : 0.02 + sp * 0.16; audio.wind.f.frequency.value = 350 + sp * 900;
  }
}
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

V = buildView();
fit();
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
